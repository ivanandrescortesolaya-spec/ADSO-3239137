services:
  mysql:
    image: mysql:8.4
    container_name: music-school-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: music_school
      MYSQL_USER: music_school_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - music_school_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  music_school_data: